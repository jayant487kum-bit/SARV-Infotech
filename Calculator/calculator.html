<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>

    <main class="calculator">

        <div class="calculator-top">
            <span class="brand">ORBIT<span>_CALC</span></span>
            <span class="status">● ONLINE</span>
        </div>

        <!-- Display -->
        <section class="display">
            <div id="previous-display"></div>
            <div id="current-display">0</div>
        </section>

        <!-- Calculator buttons -->
        <section class="buttons" id="buttons">

            <button class="function" data-action="clear">AC</button>
            <button class="function" data-action="delete">DEL</button>
            <button class="operator" data-operation="%">%</button>
            <button class="operator" data-operation="÷">÷</button>

            <button data-number="7">7</button>
            <button data-number="8">8</button>
            <button data-number="9">9</button>
            <button class="operator" data-operation="×">×</button>

            <button data-number="4">4</button>
            <button data-number="5">5</button>
            <button data-number="6">6</button>
            <button class="operator" data-operation="−">−</button>

            <button data-number="1">1</button>
            <button data-number="2">2</button>
            <button data-number="3">3</button>
            <button class="operator" data-operation="+">+</button>

            <button class="zero" data-number="0">0</button>
            <button data-number=".">.</button>
            <button class="equals" data-action="calculate">=</button>

        </section>

        <!-- History -->
        <section class="history">
            <div class="history-heading">
                <span>CALCULATION LOG</span>
                <button id="clear-history">CLEAR</button>
            </div>

            <ul id="history-list"></ul>
        </section>

    </main>

    <script src="calculator.js"></script>
</body>
</html>
